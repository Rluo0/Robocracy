<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robocracy</title>
<style>
  :root { --bg: #0b0d12; --panel: #151821; --line: #262b38; --text: #e8eaf0; --dim: #8b93a7; --accent: #fde047; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: 0.04em; }
  h1 span { color: var(--accent); }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--line); border: 1px solid #343a4a; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #343a4a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 800; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: none; border-style: dashed; color: var(--dim); width: 100%; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  input[type=text], select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input[type=color] { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; flex: none; cursor: pointer; }
  .row { display: flex; gap: 6px; align-items: center; }
  .dim { color: var(--dim); }

  #setup { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  #setup header p { margin: 2px 0 22px; color: var(--dim); }
  #setup label { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  #question { display: block; width: 100%; margin-top: 6px; font-size: 20px; font-weight: 700; padding: 10px 12px; }
  #options { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; margin: 18px 0; align-items: start; }
  .opt { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
  .opt-head { display: flex; gap: 6px; }
  .opt-head input[type=text] { flex: 1; font-weight: 700; font-size: 16px; }
  .bot { display: flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 8px; padding: 6px; }
  .bot canvas { flex: none; }
  .bot canvas[data-prev] { cursor: pointer; }
  .bot-fields { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .bot-fields input[type=text] { width: 100%; }
  .bot-sum { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot > button { padding: 4px 7px; flex: none; }
  .addopt { min-height: 90px; }
  #setup footer { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  #seed { width: 110px; font-family: ui-monospace, monospace; }
  #setup footer .primary { font-size: 18px; padding: 10px 26px; }
  #error { color: #f87171; min-height: 1.4em; }

  #battle { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; padding: 14px; height: 100vh; }
  #side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #title { margin: 0; font-size: 18px; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #clock { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  #hud { overflow-y: auto; display: grid; gap: 10px; align-content: start; }
  .team { background: var(--panel); border-left: 4px solid var(--c); border-radius: 8px; padding: 8px 10px; }
  .team h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 6px; }
  .team h3 span { margin-left: auto; color: var(--dim); font-weight: 400; }
  .hbot { margin-top: 7px; }
  .hbot.dead { opacity: 0.35; text-decoration: line-through; }
  .hname { font-weight: 600; }
  .hname em { font-style: normal; font-weight: 400; color: var(--dim); font-size: 12px; }
  .hstats { color: var(--dim); font-size: 10.5px; }
  .bar { height: 5px; background: var(--bg); border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); width: 100%; }

  #stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100%, calc((100vh - 28px) * 960 / 624)); }
  #arena { display: block; width: 100%; border-radius: 8px; background: var(--panel); }
  #feed { position: absolute; left: 14px; bottom: 12px; display: flex; flex-direction: column-reverse; gap: 3px; pointer-events: none; font-size: 13px; }
  #feed div { background: rgba(11, 13, 18, 0.75); padding: 2px 8px; border-radius: 4px; width: fit-content; }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(110px, 30vw, 340px); line-height: 1; font-weight: 900; color: var(--accent); text-shadow: 0 6px 0 #000, 0 0 40px rgba(253, 224, 71, 0.5); pointer-events: none; animation: pop 0.9s ease-out both; }
  #count.word { font-size: clamp(60px, 16vw, 180px); }
  @keyframes pop { 0% { transform: scale(2.2); opacity: 0; } 18% { transform: scale(1); opacity: 1; } 75% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.35; } }
  #announcer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); display: flex; gap: 12px; align-items: center; pointer-events: none; animation: drop 0.35s ease-out; }
  @keyframes drop { from { top: -80px; opacity: 0; } }
  .abot { flex: none; position: relative; width: 64px; height: 52px; background: #3a4258; border: 3px solid var(--accent); border-radius: 10px; display: grid; grid-template-columns: auto auto; place-content: center; gap: 7px 14px; }
  .abot::before { content: ''; position: absolute; top: -15px; left: calc(50% - 2px); width: 4px; height: 12px; background: var(--accent); border-radius: 2px 2px 0 0; box-shadow: 0 -4px 0 2px #ef4444; }
  .abot i { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .abot b { grid-column: 1 / -1; justify-self: center; width: 30px; height: 8px; background: var(--accent); border-radius: 2px; animation: talk 0.22s steps(2) infinite alternate; }
  @keyframes talk { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
  #say { margin: 0; background: rgba(21, 24, 33, 0.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 15px; }
  #result { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11, 13, 18, 0.8); border-radius: 8px; overflow: auto; padding: 12px; }
  .verdict { background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 12px; padding: 20px 24px; text-align: center; max-width: 640px; width: 100%; }
  .verdict h2 { font-size: 40px; margin: 4px 0; color: var(--c); }
  .verdict small { color: var(--dim); }
  .verdict table { width: 100%; border-collapse: collapse; margin: 12px 0; text-align: left; font-size: 13px; }
  .verdict th { color: var(--dim); font-weight: 500; }
  .verdict td, .verdict th { padding: 3px 6px; border-bottom: 1px solid var(--line); }
  .verdict .row { justify-content: center; margin-bottom: 10px; }
  .champ { display: flex; gap: 14px; align-items: center; justify-content: center; margin: 12px 0 4px; text-align: left; }
  .champ canvas { flex: none; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
  .champ b { font-size: 20px; display: block; }
  .champ .cry { font-style: italic; color: var(--text); }
  .verdict td small { display: block; font-size: 11px; }

  dialog#garage { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--accent)); border-radius: 12px; padding: 0; width: min(780px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: hidden; }
  dialog#garage[open] { display: flex; flex-direction: column; }
  dialog#garage::backdrop { background: rgba(5, 7, 10, 0.78); }
  .g-body { display: grid; gap: 16px; padding: 14px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  .g-stage { display: grid; gap: 4px; justify-items: center; text-align: center; align-content: start; min-width: 0; }
  .g-stage canvas { width: 200px; height: 200px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
  .g-name { font-size: 24px; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
  .g-cry { font-style: italic; overflow-wrap: anywhere; }
  .g-fields { display: grid; gap: 12px; min-width: 0; }
  .g-field { display: grid; gap: 4px; min-width: 0; }
  .g-field > span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .g-field .row input[type=text] { flex: 1; }
  .g-colors { display: flex; gap: 18px; flex-wrap: wrap; }
  .g-colors label { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { padding: 4px 9px; border-radius: 999px; font-size: 13px; }
  .blurb { color: var(--dim); font-size: 12px; min-height: 1.4em; }
  .g-foot { display: flex; gap: 8px; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); }
  .g-foot .primary { padding: 8px 26px; }

  #lobby { margin: 0 0 18px; }
  .lobby { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
  .lobby-top { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center; }
  .lobby-qr { background: #fff; border-radius: 8px; max-width: 100%; height: auto; image-rendering: pixelated; }
  .lobby-join { text-align: center; display: grid; gap: 6px; }
  .lobby-code { font-size: clamp(64px, 12vw, 140px); font-weight: 900; line-height: 1; letter-spacing: 0.14em; color: var(--accent); font-family: ui-monospace, monospace; }
  .lobby-url { color: var(--dim); font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .lobby-warn { color: #fbbf24; }
  .lobby-err { color: #f87171; min-height: 1.4em; }
  .lobby-bots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
  .lobby-bots .bot { padding: 4px 6px; }
  .lobby-bots .bot-fields { gap: 0; }
  .lobby-bots .bot-fields b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lobby-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  #setup .lobby-foot label { display: flex; gap: 6px; align-items: center; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
  .lobby-foot .primary { font-size: 16px; padding: 8px 20px; }
  .lobby-foot .primary:disabled { opacity: 0.4; cursor: default; }

  @media (min-width: 640px) {
    .g-body { grid-template-columns: 240px minmax(0, 1fr); padding: 18px; gap: 22px; }
  }

  @media (max-width: 820px) {
    #battle { grid-template-columns: 1fr; height: auto; }
    #stage { order: -1; }
    #wrap { width: 100%; }
    #result { position: fixed; border-radius: 0; z-index: 1; }
  }
</style>
</head>
<body>
  <section id="setup">
    <header>
      <h1>ROBO<span>CRACY</span></h1>
      <p>Can't agree? Build a robot, drop it in the arena, and let the wreckage decide.</p>
    </header>
    <label for="question">The argument</label>
    <input type="text" id="question" placeholder="What are we deciding?" maxlength="80">
    <div id="options"></div>
    <div id="lobby"></div>
    <footer>
      <div>
        <div id="mode" class="dim"></div>
        <div id="error"></div>
      </div>
      <div class="row">
        <span class="dim">Seed</span>
        <input type="text" id="seed" maxlength="16" title="Same seed, same battle">
        <button data-act="reseed" title="New seed">🎲</button>
        <button class="primary" data-act="start">Start battle</button>
      </div>
    </footer>
  </section>

  <section id="battle" hidden>
    <aside id="side">
      <h2 id="title"></h2>
      <div id="controls">
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
        <button id="skip" title="Skip to the result">⏭</button>
        <button id="mute" title="Sound">🔊</button>
        <button id="quit" title="Back to setup">✕</button>
        <span id="clock"></span>
      </div>
      <div id="hud"></div>
    </aside>
    <div id="stage">
      <div id="wrap">
        <canvas id="arena"></canvas>
        <div id="feed"></div>
        <div id="announcer" hidden>
          <div class="abot"><i></i><i></i><b></b></div>
          <p id="say"></p>
        </div>
        <div id="count"></div>
        <div id="result" hidden></div>
      </div>
    </div>
  </section>

  <dialog id="garage"></dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
