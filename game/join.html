<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Robocracy</title>
<style>
  :root { --bg: #0b0d12; --panel: #151821; --line: #262b38; --text: #e8eaf0; --dim: #8b93a7; --accent: #fde047; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
  h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 0.04em; text-align: center; }
  h1 span { color: var(--accent); }
  h2 { margin: 0; font-size: 22px; text-align: center; overflow-wrap: anywhere; }
  button, input { font: inherit; color: inherit; }
  button { background: var(--line); border: 1px solid #343a4a; border-radius: 8px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
  button:active { background: #343a4a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 800; }
  button.big { width: 100%; font-size: 20px; padding: 14px; min-height: 56px; }
  button:disabled { opacity: 0.4; }
  input[type=text] { width: 100%; min-height: 44px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; font-size: 16px; }
  input[type=color] { width: 56px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; flex: none; cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; }
  .dim { color: var(--dim); }

  #app { max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; display: grid; gap: 14px; }
  .q { text-align: center; color: var(--dim); overflow-wrap: anywhere; }
  #view { display: grid; gap: 14px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; text-align: center; }
  .note.err { color: #f87171; }
  .center { text-align: center; display: grid; gap: 12px; justify-items: center; }
  .stage { display: grid; gap: 4px; justify-items: center; text-align: center; }
  .stage canvas { width: min(220px, 60vw); height: min(220px, 60vw); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .g-name { font-size: 22px; font-weight: 900; overflow-wrap: anywhere; }
  .g-cry { font-style: italic; overflow-wrap: anywhere; }
  .g-fields { display: grid; gap: 14px; min-width: 0; }
  .g-field { display: grid; gap: 6px; min-width: 0; }
  .g-field > span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .g-field .row input[type=text] { flex: 1; }
  .g-colors { display: flex; gap: 22px; flex-wrap: wrap; }
  .g-colors label { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { overflow-wrap: anywhere; padding: 8px 14px; border-radius: 999px; font-size: 15px; min-height: 40px; }
  .chip.on { background: var(--accent); color: #111; border-color: var(--accent); }
  .chip.side { border: 2px solid var(--c); }
  .chip.side.on { background: var(--c); color: #111; border-color: var(--c); font-weight: 800; }
  .blurb { color: var(--dim); font-size: 13px; min-height: 1.4em; }
  .code { text-transform: uppercase; text-align: center; font-size: 32px !important; letter-spacing: 0.3em; font-weight: 800; }
  .big-msg { font-size: 26px; font-weight: 900; overflow-wrap: anywhere; }
  .foot { text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <main id="app">
    <h1>ROBO<span>CRACY</span></h1>
    <div id="view"></div>
    <div class="foot" id="foot"></div>
  </main>
  <script type="module" src="src/join.js"></script>
</body>
</html>
