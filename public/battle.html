<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROBOT ROYALE Battle</title>
  <meta name="theme-color" content="#141216">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!--
    Standalone battle for a room: /battle?room=CODE.
    The host lobby normally runs the battle in-page (host.js), which keeps sound unlocked.
    This page needs one click first, because browsers block audio on a freshly loaded page.
  -->
  <main id="gate" class="center-screen">
    <h2>Battle ready</h2>
    <p class="muted" id="gate-text">Loading fighters…</p>
    <button class="btn mega" id="go" disabled><i class="ph-fill ph-hand-fist" aria-hidden="true"></i>FIGHT!</button>
  </main>
  <div id="battle"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/sfx.js"></script>
  <script type="module">
    import { mountBattle } from '/js/battle.js';

    const socket = io();
    const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
    const hostKey = sessionStorage.getItem(`rr-host-${code}`);
    const $ = (id) => document.getElementById(id);

    const res = await fetch(`/api/rooms/${code}`);
    const room = res.ok ? await res.json() : null;
    if (!room || room.players.length < 2) {
      $('gate-text').textContent = room ? 'Need at least 2 fighters in this room.' : `Room ${code || '(none)'} not found.`;
    } else {
      $('gate-text').textContent = `${room.players.length} fighters in room ${room.code}.`;
      $('go').disabled = false;
    }

    $('go').addEventListener('click', () => {
      RR.sfx.unlock();
      $('gate').classList.add('hidden');
      const view = mountBattle($('battle'), {
        room,
        onResult: (winner) => hostKey && socket.emit('battle:result', { code, hostKey, winnerId: winner.id }),
        onPlayAgain: () => {
          view.destroy();
          if (hostKey) socket.emit('host:reset', { code, hostKey });
          location.href = hostKey ? `/host?room=${code}` : '/';
        },
      });
    });
  </script>
</body>
</html>
