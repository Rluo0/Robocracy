<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join ROBOT ROYALE</title>
  <meta name="theme-color" content="#ffd23f">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="phone">
    <div class="phone-top"><span class="brand" translate="no">ROBOT ROYALE</span></div>

    <!-- Join form -->
    <main id="form-screen" class="phone-main">
      <h1>Enter the <em>arena</em></h1>
      <form id="join-form" class="phone-main" style="padding: 0; gap: 20px" autocomplete="off" novalidate>
        <div class="field">
          <label for="code">Room code</label>
          <input id="code" name="room" class="code-input" autocomplete="off" maxlength="4" required autocapitalize="characters" inputmode="text" spellcheck="false">
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="nickname" maxlength="16" required placeholder="Sparky…" autocomplete="nickname">
        </div>
        <div class="field">
          <label for="pick">What are you fighting for?</label>
          <input id="pick" name="pick" maxlength="32" required placeholder="Pizza…" autocomplete="off" aria-describedby="pick-help">
          <span class="help" id="pick-help">Your robot carries this into battle.</span>
        </div>
        <p id="form-error" class="error hidden" role="alert"></p>
        <button class="btn mega" type="submit" id="join-btn" style="font-size: 26px"><i class="ph-fill ph-lightning" aria-hidden="true"></i>FIGHT</button>
      </form>
    </main>

    <!-- Robot garage: shown right after a fresh join, and again from "Edit robot" -->
    <main id="garage-screen" class="phone-main garage hidden">
      <h1>Build your <em>robot</em></h1>
      <div class="g-stage" id="garage-stage">
        <canvas id="garage-cv" width="560" height="560" aria-label="Your robot"></canvas>
      </div>

      <div class="field">
        <label for="g-name">Robot name</label>
        <div class="g-row">
          <input id="g-name" maxlength="18" autocomplete="off" spellcheck="false">
          <button type="button" class="btn dark icon-only" id="g-name-dice" aria-label="Random name"><i class="ph-bold ph-dice-five" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="field">
        <label for="g-cry">Battle cry</label>
        <div class="g-row">
          <input id="g-cry" maxlength="32" autocomplete="off" spellcheck="false">
          <button type="button" class="btn dark icon-only" id="g-cry-dice" aria-label="Random battle cry"><i class="ph-bold ph-dice-five" aria-hidden="true"></i></button>
        </div>
      </div>

      <div class="g-colors">
        <label for="g-color">Paint <input type="color" id="g-color"></label>
        <label for="g-accent">Accent <input type="color" id="g-accent"></label>
      </div>

      <div class="g-group"><span class="g-label">Chassis</span><div class="chips" id="chips-chassis"></div><p class="blurb" id="blurb-chassis"></p></div>
      <div class="g-group"><span class="g-label">Weapon</span><div class="chips" id="chips-weapon"></div><p class="blurb" id="blurb-weapon"></p></div>
      <div class="g-group"><span class="g-label">Eyes</span><div class="chips" id="chips-eyes"></div></div>
      <div class="g-group"><span class="g-label">Topper</span><div class="chips" id="chips-hat"></div></div>
      <div class="g-group"><span class="g-label">Pattern</span><div class="chips" id="chips-pattern"></div></div>

      <button type="button" class="btn dark" id="g-surprise"><i class="ph-bold ph-dice-five" aria-hidden="true"></i>Surprise me</button>
      <button type="button" class="btn mega" id="g-done" style="font-size: 26px"><i class="ph-fill ph-check-fat" aria-hidden="true"></i>DONE</button>
    </main>

    <!-- Status after joining -->
    <main id="status-screen" class="phone-main hidden">
      <div class="status">
        <div class="stage" id="stage"></div>
        <h1 id="status-title">You're in!</h1>
        <p class="status-text" id="status-text" aria-live="polite">Eyes on the big screen.</p>
        <div class="me-tag" id="me">
          <span class="name" id="me-name"></span>
          <span class="by" id="me-by"></span>
          <span class="pick" id="me-pick"></span>
        </div>
        <div class="status-actions">
          <button class="btn dark" id="edit-robot"><i class="ph-bold ph-wrench" aria-hidden="true"></i>Edit robot</button>
          <button class="btn dark" id="leave"><i class="ph-bold ph-sign-out" aria-hidden="true"></i>Leave</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/sfx.js"></script>
  <script type="module" src="/js/join.js"></script>
</body>
</html>
